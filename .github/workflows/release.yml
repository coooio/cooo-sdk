name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.2
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Verify release tag
        uses: actions/github-script@v8
        with:
          script: |
            const { readFile } = require('node:fs/promises');
            const pkg = JSON.parse(await readFile('package.json', 'utf8'));
            const tag = context.ref.replace('refs/tags/v', '');
            if (pkg.version !== tag) {
              core.setFailed(`Tag v${tag} does not match package version ${pkg.version}.`);
            }
      - run: npm pack --dry-run
      # npm Trusted Publishing uses the GitHub Actions OIDC identity.
      # No long-lived NPM_TOKEN is required or read by this job.
      - run: npm publish --access public

