name: Devnet E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/devnet-e2e.yml'
      - 'backend/cooo-lyquid/**'
      - 'devnet/**'
      - 'examples/agent-held-workflow.mjs'
      - 'devnet/provider-digest-e2e.mjs'
      - 'test/run-devnet-digest-e2e.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/devnet-e2e.yml'
      - 'backend/cooo-lyquid/**'
      - 'devnet/**'
      - 'examples/agent-held-workflow.mjs'
      - 'devnet/provider-digest-e2e.mjs'
      - 'test/run-devnet-digest-e2e.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  provider-digest:
    name: Provider digest authoritative recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: bash test/run-devnet-digest-e2e.sh